<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <link rel="manifest" href="/manifest.json">
    <title>ระบบจัดการหลังบ้าน - Mongkol Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/admin.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="admin-body">
    <div id="admin-app">
        <!-- Login Screen -->
        <div id="login-screen" class="animate-fade"
            style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
            <div class="glass-card login-card" style="width: 100%; max-width: 420px; padding: var(--spacing-xl);">
                <div class="login-header" style="text-align: center; margin-bottom: var(--spacing-xl);">
                    <div style="display: flex; justify-content: center; margin-bottom: var(--spacing-md);">
                        <div style="background: white; border-radius: 12px; padding: 10px 20px; display: inline-flex; box-shadow: 0 4px 24px rgba(212,32,32,0.3);">
                            <img src="/src/assets/logo-black.png" alt="Mongkol Bar" style="height: 64px; object-fit: contain; display: block;">
                        </div>
                    </div>
                    <p style="color: var(--text-dim); font-weight: 500; letter-spacing: 0.05em; font-size: 0.9rem;">Management Portal</p>
                    <p style="color: var(--text-dimmer); font-size: 0.8rem; margin-top: 4px;">เข้าสู่ระบบจัดการ</p>
                </div>
                <form id="login-form">
                    <div class="form-group" style="margin-bottom: var(--spacing-md);">
                        <label>ชื่อผู้ใช้งาน (Username)</label>
                        <input type="text" name="username" required placeholder="กรอกชื่อผู้ใช้งาน"
                            autocomplete="username">
                    </div>
                    <div class="form-group" style="margin-bottom: var(--spacing-xl);">
                        <label>รหัสผ่าน (Password)</label>
                        <input type="password" name="password" required placeholder="กรอกรหัสผ่าน"
                            autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; height: 56px;">
                        เข้าสู่ระบบ
                    </button>
                </form>
            </div>
        </div>

        <!-- Main Dashboard UI (Hidden by default) -->
        <div id="dashboard-layout" style="display: none;">
            <aside class="sidebar">
                <div class="sidebar-brand" style="padding: 16px; border-bottom: 1px solid rgba(212, 32, 32, 0.2);">
                    <div style="background: white; border-radius: 8px; padding: 6px 12px; display: inline-flex; align-items: center; box-shadow: 0 2px 12px rgba(212,32,32,0.25);">
                        <img src="/src/assets/logo-black.png" alt="Mongkol Bar" style="height: 36px; object-fit: contain; display: block;">
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <button class="nav-item active" data-view="dashboard" style="display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i> ภาพรวมแดชบอร์ด
                    </button>
                    <button class="nav-item" data-view="bookings" style="display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="calendar-check" style="width: 18px; height: 18px;"></i> รายการจองทั้งหมด
                    </button>
                    <button class="nav-item" data-view="zones" style="display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="map-pin" style="width: 18px; height: 18px;"></i> จัดการโซนและราคา
                    </button>
                    <button class="nav-item" data-view="special-dates" style="display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="calendar-days" style="width: 18px; height: 18px;"></i> วันพิเศษและอีเวนท์
                    </button>
                    <button class="nav-item" data-view="map" style="display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="map" style="width: 18px; height: 18px;"></i> ออกแบบผังร้าน
                    </button>
                    <button class="nav-item" data-view="revenue" style="display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="bar-chart-2" style="width: 18px; height: 18px;"></i> สรุปรายได้
                    </button>
                    <button class="nav-item" data-view="settings" style="display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="settings" style="width: 18px; height: 18px;"></i> ตั้งค่าระบบ
                    </button>
                </nav>
                <div class="sidebar-footer">
                    <button id="btn-logout" class="btn btn-ghost" style="width: 100%;">ออกจากระบบ</button>
                </div>
            </aside>

            <main class="admin-content">
                <header class="admin-header">
                    <h2 id="view-title">ภาพรวมแดชบอร์ด</h2>
                    <div class="user-info" style="display: flex; align-items: center; gap: 12px;">
                        <div id="connection-status" title="เชื่อมต่อ Real-time อยู่" style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; flex-shrink: 0;"></div>
                        <button id="btn-toggle-sound" title="เปิด/ปิดเสียงแจ้งเตือน" style="background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; display: flex; align-items: center;">
                            <i data-lucide="bell" style="width: 18px; height: 18px;"></i>
                        </button>
                        <span id="owner-name">Admin</span>
                    </div>
                </header>

                <div id="admin-view-content" class="animate-fade">
                    <!-- Views will be rendered here -->
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="/src/admin.js"></script>
    <script>
        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>

</html>
